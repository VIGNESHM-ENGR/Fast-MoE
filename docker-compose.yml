# Fast-MoE with an NVIDIA GPU: `docker compose up`, then open http://127.0.0.1:7860
# Requires the NVIDIA Container Toolkit on the host. CPU-only hosts:
#   docker compose -f docker-compose.cpu.yml up

services:
  fast-moe:
    build:
      context: .
      args:
        BASE: ghcr.io/ggml-org/llama.cpp:server-cuda-b10920
    image: fast-moe:cuda
    # Run as the host user so models downloaded into ./models aren't owned by root.
    user: "${FAST_MOE_UID:-1000}:${FAST_MOE_GID:-1000}"
    ports:
      - "127.0.0.1:7860:7860"  # control panel
      - "127.0.0.1:8080:8080"  # OpenAI-compatible API while a model is running
    volumes:
      - ./models:/models
    # RAM cap for the container, e.g. FAST_MOE_RAM_LIMIT=20g (./start.sh --ram-limit 20g); unset = no cap.
    # The memory-mapped model counts as reclaimable cache, so a cap below the model size makes the
    # kernel re-read expert pages from disk instead of failing.
    mem_limit: ${FAST_MOE_RAM_LIMIT:-0}
    memswap_limit: ${FAST_MOE_RAM_LIMIT:-0}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    init: true  # reaps llama-server and forwards stop signals
    restart: unless-stopped
