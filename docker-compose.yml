# Zero-config runner: `docker compose up`. See TASKS.md milestone M7.
#
# GPU passthrough requires the NVIDIA Container Toolkit on the host.
# For CPU-only hosts, run: docker compose --profile cpu up

services:
  fast-moe-gpu:
    build:
      context: .
      target: gpu
    image: fast-moe:gpu
    ports:
      - "8000:8000" # OpenAI-compatible API
      - "7860:7860" # Gradio UI
    volumes:
      - /mnt/nvme_cache:/mnt/nvme_cache
      - ~/.cache/huggingface:/root/.cache/huggingface
    environment:
      - FAST_MOE_NVME_CACHE_DIR=/mnt/nvme_cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  fast-moe-cpu:
    build:
      context: .
      target: cpu
    image: fast-moe:cpu
    profiles: ["cpu"]
    ports:
      - "8000:8000"
      - "7860:7860"
    volumes:
      - /mnt/nvme_cache:/mnt/nvme_cache
      - ~/.cache/huggingface:/root/.cache/huggingface
    environment:
      - FAST_MOE_NVME_CACHE_DIR=/mnt/nvme_cache
      - FAST_MOE_CPU_ONLY=1
