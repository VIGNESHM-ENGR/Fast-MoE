name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Use the exact ruff pin from pyproject.toml so CI and local lint agree.
      - name: Install ruff
        run: python -m pip install "$(grep -oE 'ruff==[0-9.]+' pyproject.toml)"
      - name: Ruff
        run: ruff check --output-format=github engine ui tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      # No GPU, llama.cpp build or model downloads are needed: tests use mocks and fixtures.
      - name: Pytest
        run: python -m pytest -q
