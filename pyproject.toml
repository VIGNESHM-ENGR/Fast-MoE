[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-moe"
version = "0.1.0"
description = "Zero-config, visual runner for Mixture-of-Experts LLMs on consumer GPUs, built on llama.cpp"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9",
    "nvidia-ml-py>=12.535",  # official NVML bindings; the `pynvml` PyPI package is deprecated
    "pyyaml>=6.0",
    "huggingface_hub>=1.0",
    "gradio>=5.0",
    # Inference runs in llama.cpp's llama-server (native build or official Docker image), not in Python.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "ruff>=0.4",
]

[project.scripts]
fast-moe = "engine.serve:main"

[tool.setuptools.packages.find]
include = ["engine*", "ui*"]

[tool.ruff]
line-length = 100
target-version = "py310"
