[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-moe"
version = "0.1.0"
description = "Zero-config, visual runner for Mixture-of-Experts LLMs on consumer GPUs, built on llama.cpp"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9",
    "nvidia-ml-py>=12.535",  # official NVML bindings; the `pynvml` PyPI package is deprecated
    "pyyaml>=6.0",
    "huggingface_hub>=1.0",
    "gguf>=0.17",  # llama.cpp's GGUF reader, for tensor names and sizes
    "gradio>=6.0",  # app-level css/theme are launch() arguments since 6.0
    "openai>=1.40",  # chat panel talks to llama-server's OpenAI-compatible API
    # Inference runs in llama.cpp's llama-server (native build or official Docker image), not in Python.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "ruff==0.16.7",  # pinned: ruff's default rule set changes between releases
]

[project.scripts]
fast-moe = "engine.serve:main"

[tool.setuptools.packages.find]
include = ["engine*", "ui*"]

[tool.setuptools.package-data]
ui = ["assets/*.css", "assets/fonts/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# Nested `with` blocks mirror the Gradio page structure (tab > row > column).
"ui/**" = ["SIM117"]
